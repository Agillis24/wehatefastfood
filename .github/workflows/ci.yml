name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows is the primary development environment, so it is also what CI
    # runs. A pipeline that only proves the code works on Linux does not prove
    # the thing we need proved.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      # Seed included on purpose: CI verifies that the build WORKS, and a
      # production build with no content deliberately refuses to export (see
      # scripts/build.mjs). CI has no audience, so the fake data harms nobody.
      - name: Build
        run: npm run build
        env:
          WFF_INCLUDE_SEED: '1'

      # After the build, not in `npm run check`, where it runs before an export
      # exists and skips - which made it a gate that never fired on the artefact
      # it was written to read.
      - name: Check the exported metadata
        run: node scripts/seo-check.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Rebuilds with seed content included - see scripts/e2e.mjs for why.
      - name: Smoke tests
        run: npm run test:e2e

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Advisory only. Next 15 carries transitive postcss and sharp advisories
      # with no patched 15.x release; moving to 16 is a stack decision, not a
      # CI decision. Failing every build on it would just train us to ignore CI.
      - name: Audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high
